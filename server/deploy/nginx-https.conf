map $http_origin $music_guess_cors_origin {
    default "";
    "https://luo-yi-ba.pages.dev" $http_origin;
    "https://www.bilibili.com" $http_origin;
    "https://www.bilibilitoy.com" $http_origin;
    ~^http://(?:localhost|127\.0\.0\.1)(?::\d+)?$ $http_origin;
}

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
        default_type text/plain;
    }

    location / {
        return 308 https://$host$request_uri;
    }
}

server {
    listen 443 ssl default_server;
    listen [::]:443 ssl default_server;
    server_name _;
    client_max_body_size 64k;

    ssl_certificate /etc/letsencrypt/live/8.217.219.36/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/8.217.219.36/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;

    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options "nosniff" always;

    location ^~ /media/music-guess/assets/ {
        alias /var/www/luo-yi-ba/music-guess/assets/;

        types {
            audio/mpeg mp3;
        }

        default_type audio/mpeg;
        add_header Access-Control-Allow-Origin $music_guess_cors_origin always;
        add_header Access-Control-Allow-Methods "GET, HEAD, OPTIONS" always;
        add_header Access-Control-Allow-Headers "Range" always;
        add_header Access-Control-Expose-Headers "Accept-Ranges, Content-Length, Content-Range" always;
        add_header Access-Control-Max-Age "86400" always;
        add_header Access-Control-Allow-Credentials "false" always;
        add_header Vary "Origin" always;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header Accept-Ranges bytes always;
        add_header Strict-Transport-Security "max-age=31536000" always;
        add_header X-Content-Type-Options "nosniff" always;

        if ($request_method = OPTIONS) {
            return 204;
        }
    }

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 1h;
        proxy_send_timeout 1h;
    }
}
